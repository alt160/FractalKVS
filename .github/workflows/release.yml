name: Release

on:
  push:
    tags: ["v*.*.*"]
    # Resume a failed publication without moving its immutable source tag.
    branches: ["codex/release-v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Derive immutable release tag
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#codex/release-}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag or codex/release-vX.Y.Z resume branch." >&2
            exit 1
          fi
          echo "FRACTALKVS_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "FRACTALKVS_PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.FRACTALKVS_RELEASE_TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify source tag and project version
        shell: pwsh
        run: |
          [xml] $project = Get-Content FractalKVS.csproj -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/PackageVersion').InnerText
          if ($projectVersion -cne $env:FRACTALKVS_PACKAGE_VERSION) {
            throw 'The immutable source tag and project package version differ.'
          }

      - name: Restore and build
        run: |
          dotnet restore FractalKVS.csproj
          dotnet build FractalKVS.csproj --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Pack
        run: dotnet pack FractalKVS.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=${{ env.FRACTALKVS_PACKAGE_VERSION }}

      - name: Smoke test package consumer
        run: |
          dotnet build tests/FractalKVS.PackageSmoke/FractalKVS.PackageSmoke.csproj --configuration Release /p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/packages /p:FractalKVSPackageVersion=${{ env.FRACTALKVS_PACKAGE_VERSION }} /p:TreatWarningsAsErrors=true
          dotnet tests/FractalKVS.PackageSmoke/bin/Release/net8.0/FractalKVS.PackageSmoke.dll

      - name: Create precompiled library archive and checksums
        shell: pwsh
        run: |
          $stage = 'artifacts/precompiled'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          Copy-Item bin/Release/net8.0/FractalKVS.dll,bin/Release/net8.0/FractalKVS.xml,bin/Release/net8.0/FractalKVS.pdb,README.md,LICENSE,CHANGELOG.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/packages/FractalKVS-$env:FRACTALKVS_PACKAGE_VERSION-net8.0.zip"
          Get-ChildItem artifacts/packages -File | Where-Object Extension -In '.nupkg','.snupkg','.zip' | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content artifacts/packages/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Authenticate to NuGet.org through trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: iqueue

      - name: Publish NuGet package
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$FRACTALKVS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$FRACTALKVS_RELEASE_TAG" artifacts/packages/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$FRACTALKVS_RELEASE_TAG" artifacts/packages/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
