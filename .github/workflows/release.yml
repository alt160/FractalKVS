name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "FRACTALKVS_PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore and build
        run: |
          dotnet restore FractalKVS.csproj
          dotnet build FractalKVS.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack FractalKVS.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=${{ env.FRACTALKVS_PACKAGE_VERSION }}

      - name: Smoke test package consumer
        run: |
          dotnet restore tests/FractalKVS.PackageSmoke/FractalKVS.PackageSmoke.csproj /p:RestoreAdditionalProjectSources=artifacts/packages /p:FractalKVSPackageVersion=${{ env.FRACTALKVS_PACKAGE_VERSION }}
          dotnet run --project tests/FractalKVS.PackageSmoke/FractalKVS.PackageSmoke.csproj --configuration Release --no-restore /p:FractalKVSPackageVersion=${{ env.FRACTALKVS_PACKAGE_VERSION }}

      - name: Create precompiled library archive and checksums
        shell: pwsh
        run: |
          $stage = 'artifacts/precompiled'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          Copy-Item bin/Release/net8.0/FractalKVS.dll,bin/Release/net8.0/FractalKVS.xml,bin/Release/net8.0/FractalKVS.pdb,README.md,LICENSE,CHANGELOG.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/packages/FractalKVS-$env:FRACTALKVS_PACKAGE_VERSION-net8.0.zip"
          Get-ChildItem artifacts/packages -File | Where-Object Extension -In '.nupkg','.snupkg','.zip' | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content artifacts/packages/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Authenticate to NuGet.org through trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: iqueue

      - name: Publish NuGet package
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/packages/* --generate-notes --verify-tag
